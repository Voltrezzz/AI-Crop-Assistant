<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/leaf.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Marudham 360 - AI-powered crop health analysis and protection for Indian farmers" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <script>
      (function (location) {
        if (location.search.startsWith('?/')) {
          const restoredPath = location.search
            .slice(2)
            .split('&')
            .map(part => part.replace(/~and~/g, '&'))
            .join('?');
          window.history.replaceState(null, '', location.pathname + restoredPath + location.hash);
        }
      })(window.location);
    </script>
    <title>Marudham 360</title>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
      
      // Fix for React + Google Translate crash
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            if (console) console.warn('Cannot remove a child from a different parent', child, this);
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (console) console.warn('Cannot insert before a reference node from a different parent', referenceNode, this);
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
