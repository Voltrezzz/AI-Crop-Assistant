<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marudham 360</title>
    <script>
      const pathSegmentsToKeep = 1;
      const location = window.location;
      const repositoryRoot = location.pathname
        .split('/')
        .slice(0, pathSegmentsToKeep + 1)
        .join('/');
      const route = location.pathname
        .slice(1)
        .split('/')
        .slice(pathSegmentsToKeep)
        .join('/')
        .replace(/&/g, '~and~');
      const query = location.search
        ? `&${location.search.slice(1).replace(/&/g, '~and~')}`
        : '';

      location.replace(
        `${location.protocol}//${location.host}${repositoryRoot}/?/${route}${query}${location.hash}`,
      );
    </script>
  </head>
  <body></body>
</html>
